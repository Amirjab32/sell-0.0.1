<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" fill="none">
  <rect width="1280" height="360" fill="#FAFAFA"/>
  <rect width="1280" height="172" fill="#059669"/>
  <rect x="0" y="172" width="1280" height="2" fill="#047857" fill-opacity="0.25"/>

  <!-- Subtle architectural grid on top emerald band -->
  <g stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="172"/>
    <line x1="320" y1="0" x2="320" y2="172"/>
    <line x1="480" y1="0" x2="480" y2="172"/>
    <line x1="640" y1="0" x2="640" y2="172"/>
    <line x1="800" y1="0" x2="800" y2="172"/>
    <line x1="960" y1="0" x2="960" y2="172"/>
    <line x1="1120" y1="0" x2="1120" y2="172"/>
  </g>

  <!-- Stylized Triple-Fan GPU Illustration on Left -->
  <g transform="translate(130, 56)">
    <rect x="14" y="22" width="440" height="218" rx="18" fill="#18181B" stroke="#27272A" stroke-width="3"/>
    <rect x="26" y="34" width="416" height="194" rx="12" fill="#27272A"/>
    <!-- Top accent bar -->
    <rect x="44" y="24" width="120" height="6" rx="3" fill="#10B981"/>
    <rect x="330" y="24" width="60" height="6" rx="3" fill="#3F3F46"/>
    <!-- Three cooling fans -->
    <g transform="translate(96, 131)">
      <circle r="52" fill="#18181B" stroke="#3F3F46" stroke-width="3"/>
      <circle r="40" fill="#09090B" stroke="#27272A" stroke-width="2"/>
      <circle r="14" fill="#27272A" stroke="#10B981" stroke-width="2"/>
      <path d="M-32 -12 C-14 -30, 14 -30, 32 -12" stroke="#52525B" stroke-width="3" stroke-linecap="round"/>
      <path d="M-32 12 C-14 30, 14 30, 32 12" stroke="#52525B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(234, 131)">
      <circle r="52" fill="#18181B" stroke="#3F3F46" stroke-width="3"/>
      <circle r="40" fill="#09090B" stroke="#27272A" stroke-width="2"/>
      <circle r="14" fill="#27272A" stroke="#10B981" stroke-width="2"/>
      <path d="M-32 -12 C-14 -30, 14 -30, 32 -12" stroke="#52525B" stroke-width="3" stroke-linecap="round"/>
      <path d="M-32 12 C-14 30, 14 30, 32 12" stroke="#52525B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(372, 131)">
      <circle r="52" fill="#18181B" stroke="#3F3F46" stroke-width="3"/>
      <circle r="40" fill="#09090B" stroke="#27272A" stroke-width="2"/>
      <circle r="14" fill="#27272A" stroke="#10B981" stroke-width="2"/>
      <path d="M-32 -12 C-14 -30, 14 -30, 32 -12" stroke="#52525B" stroke-width="3" stroke-linecap="round"/>
      <path d="M-32 12 C-14 30, 14 30, 32 12" stroke="#52525B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- PCIe connector -->
    <rect x="78" y="240" width="160" height="14" rx="3" fill="#D4D4D8"/>
    <rect x="256" y="240" width="44" height="14" rx="3" fill="#A1A1AA"/>
  </g>

  <!-- Right Side Editorial Typography -->
  <text x="1140" y="76" text-anchor="end" fill="#ECFDF5" font-family="Vazirmatn, Tahoma, sans-serif" font-size="22" font-weight="700">خداحافظی با افت فریم!</text>
  <text x="1140" y="138" text-anchor="end" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="52" font-weight="800" letter-spacing="1">GRAPHICS</text>

  <text x="1140" y="230" text-anchor="end" fill="#52525B" font-family="Vazirmatn, Tahoma, sans-serif" font-size="22" font-weight="600">کارت‌های گرافیک و قطعات اصلی کامپیوتر</text>

  <!-- Clean CTA Pill-free Button -->
  <g transform="translate(970, 260)">
    <rect width="170" height="44" rx="10" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
    <circle cx="30" cy="22" r="13" fill="#059669"/>
    <path d="M33 16 L26 22 L33 28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="148" y="28" text-anchor="end" fill="#18181B" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" font-weight="700">مشاهده</text>
  </g>
</svg>
