<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" fill="none">
  <rect width="1280" height="360" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="360" fill="#FAFAFA"/>
  <rect x="0" y="246" width="1280" height="114" fill="#18181B"/>

  <!-- Geometric OLED Monitor Illustration -->
  <g transform="translate(115, 42)">
    <rect x="16" y="12" width="376" height="206" rx="14" fill="#18181B" stroke="#27272A" stroke-width="4"/>
    <rect x="28" y="24" width="352" height="182" rx="8" fill="#09090B"/>
    <!-- OLED contrast rings -->
    <circle cx="204" cy="115" r="64" fill="#059669" fill-opacity="0.18" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="204" cy="115" r="36" fill="#059669" fill-opacity="0.28" stroke="#34D399" stroke-width="2"/>
    <text x="204" y="123" text-anchor="middle" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="22" font-weight="800">240Hz OLED</text>
    <!-- Stand -->
    <rect x="184" y="218" width="40" height="46" fill="#3F3F46"/>
    <path d="M126 264 L282 264 L298 278 L110 278 Z" fill="#52525B"/>
  </g>

  <!-- Right Side Editorial Typography -->
  <text x="1140" y="92" text-anchor="end" fill="#059669" font-family="Vazirmatn, Tahoma, sans-serif" font-size="20" font-weight="700">دقت رنگ استودیویی و سرعت رقابتی</text>
  <text x="1140" y="152" text-anchor="end" fill="#18181B" font-family="Vazirmatn, Tahoma, sans-serif" font-size="44" font-weight="800">مانیتورهای OLED و گیمینگ</text>
  <text x="1140" y="202" text-anchor="end" fill="#52525B" font-family="Vazirmatn, Tahoma, sans-serif" font-size="20" font-weight="500">زمان پاسخ‌گویی ۰.۰۳ میلی‌ثانیه با کنتراست بی‌نهایت</text>

  <!-- Bottom CTA inside charcoal band -->
  <g transform="translate(948, 280)">
    <rect width="192" height="44" rx="10" fill="#059669"/>
    <path d="M36 16 L28 22 L36 28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="170" y="28" text-anchor="end" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" font-weight="700">مشاهده مانیتورها</text>
  </g>
</svg>
